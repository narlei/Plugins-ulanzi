		<style>
			:root {
				--warning-bg: #fff3cd;
				--warning-color: #856404;
				--warning-border: #ffeeba;
				--border-radius: 8px;
				--padding: 12px;
				--font-size: 1rem;
			}
			body {
				margin: 0;
				padding: 0;
				font-family: system-ui, sans-serif;
				background: none;
				color: #222;
				font-size: var(--font-size);
				box-sizing: border-box;
			}
			sdpi-item {
				display: block;
				margin: 0 0 1rem 0;
			}
			.warning-container {
				display: flex;
				align-items: center;
				color: var(--warning-color);
				border-radius: var(--border-radius);
				padding: var(--padding);
				gap: 0.75em;
				font-weight: 500;
				margin-bottom: 1rem;
			}
			.warning-icon {
				font-size: 1.5em;
				line-height: 1;
				flex-shrink: 0;
			}
			@media (max-width: 600px) {
				body {
					font-size: 0.98rem;
				}
				.warning-container {
					padding: 8px;
					font-size: 0.98rem;
				}
			}
