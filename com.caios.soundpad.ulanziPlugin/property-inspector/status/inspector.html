<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WS Status</title>
  <link rel="stylesheet" href="../../libs/css/udpi.css">
</head>
<body>
  <div class="udpi-wrapper hidden">
    <form id="property-inspector">
      <div class="udpi-item">
        <label class="udpi-item-label">WebSocket URL</label>
        <input name="wsUrl" type="text" placeholder="ws://localhost:8059">
      </div>
      <div class="udpi-item">
        <label class="udpi-item-label">Online Text</label>
        <input name="onlineText" type="text" placeholder="ONLINE">
      </div>
      <div class="udpi-item">
        <label class="udpi-item-label">Offline Text</label>
        <input name="offlineText" type="text" placeholder="OFFLINE">
      </div>
    </form>
  </div>

  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanzideckApi.js"></script>
  <script src="./inspector.js"></script>
</body>
</html>
